<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doomish</title>
<style>
html,body{margin:0;height:100%;background:#120806;color:#e8d9c0;font-family:"Courier New",monospace;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(18,8,6,.93);text-align:center;padding:20px}
h1{font-size:clamp(44px,12vw,104px);margin:0;color:#c1121f;letter-spacing:.08em;text-shadow:4px 4px #000}
input,button{font:inherit;font-size:18px;padding:12px 18px;background:#000;color:#e8d9c0;border:2px solid #c1121f;border-radius:0}
button{background:#c1121f;color:#fff;cursor:pointer}
button:hover,button:focus-visible{background:#e5383b;outline:2px solid #fff}
#st{min-height:1.2em;opacity:.75;max-width:30em}
small{opacity:.6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="menu">
  <h1>DOOMISH</h1>
  <input id="nm" maxlength="12" placeholder="Callsign" aria-label="Callsign">
  <button onclick="join()">Enter the arena</button>
  <div id="st"></div>
  <small>WASD move · mouse or arrow keys turn · click or space fires · click the screen to capture the mouse</small>
</div>
<script>
// After deploying the server on Render, set this to wss://<your-service>.onrender.com
// (or open the page with ?server=wss://... to override).
const SERVER = new URLSearchParams(location.search).get('server') || 'wss://pixel-doom.onrender.com';

const $ = id => document.getElementById(id), cv = $('c'), g = cv.getContext('2d');
const FOV = Math.PI / 3, TF = Math.tan(FOV / 2);
let W = 400, H = 240, zb, FL;
function rs() { H = Math.round(W * innerHeight / innerWidth); cv.width = W; cv.height = H; zb = new Float32Array(W); FL = g.createImageData(W, H - (H >> 1)); }
addEventListener('resize', rs); rs();

let snaps = [], rtt = 0, pinger;
const INTERP = 100; // ms other players are rendered in the past, so we can blend between updates
let ws, id, map = [], pl = {}, px = 2, py = 2, pa = 0, hp = 100, flash = 0, kick = 0, feed = [], keys = {}, lastSend = 0, running = 0, t0 = 0;
const ok = (x, y) => map[y | 0]?.[x | 0] === '.';

let ac;
function snd(f, d) {
  try {
    ac = ac || new AudioContext();
    const o = ac.createOscillator(), v = ac.createGain();
    o.type = 'sawtooth'; o.frequency.value = f;
    o.frequency.exponentialRampToValueAtTime(40, ac.currentTime + d);
    v.gain.value = .12; v.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
    o.connect(v); v.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch {}
}

function join() {
  $('st').textContent = 'Connecting… a sleeping Render free instance can take ~50 seconds to wake.';
  ws = new WebSocket(SERVER);
  ws.onopen = () => ws.send(JSON.stringify({ t: 'join', name: $('nm').value || 'Marine' }));
  ws.onerror = () => $('st').textContent = 'Could not reach the server. Check the SERVER url in index.html.';
  ws.onclose = () => { running = 0; clearInterval(pinger); $('menu').style.display = 'flex'; };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.t === 'init') {
      id = m.id; map = m.map; px = m.x; py = m.y; hp = 100; running = 1;
      $('menu').style.display = 'none'; t0 = performance.now(); requestAnimationFrame(loop);
      snaps = [];
      const ping = () => send({ t: 'ping', c: performance.now() });
      ping(); pinger = setInterval(ping, 2000);
    } else if (m.t === 'pong') {
      const r = performance.now() - m.c; rtt = rtt ? rtt * .7 + r * .3 : r;
    } else if (m.t === 's') {
      pl = {};
      m.p.forEach(p => pl[p[0]] = { id: p[0], name: p[1], x: p[2], y: p[3], a: p[4], hp: p[5], sc: p[6], d: p[7] });
      snaps.push({ t: performance.now(), p: pl }); if (snaps.length > 12) snaps.shift();
      const me = pl[id];
      if (me) { if (me.hp < hp) flash = 1; hp = me.hp; }
      m.e.forEach(v => {
        if (v[0] === 'f') { fired[v[1]] = performance.now(); snd(id === v[1] ? 180 : 120, .18); }
        else if (v[0] === 'k') feed.push([v[1] + ' killed ' + v[2], performance.now()]);
        else if (v[0] === 'r' && v[1] === id) { px = v[2]; py = v[3]; }
      });
    }
  };
}

addEventListener('keydown', e => { keys[e.code] = 1; if (e.code === 'Space') { e.preventDefault(); fire(); } });
addEventListener('keyup', e => keys[e.code] = 0);
cv.addEventListener('mousedown', () => { if (document.pointerLockElement !== cv) cv.requestPointerLock(); else fire(); });
addEventListener('mousemove', e => { if (document.pointerLockElement === cv) pa += e.movementX * .003; });

function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
function fire() {
  if (!running || hp <= 0 || kick > .5) return;
  kick = 1; send({ t: 'move', x: px, y: py, a: pa }); send({ t: 'shoot', a: pa, lag: Math.min(350, rtt / 2 + INTERP) });
}

function cast(ang) {
  const dx = Math.cos(ang), dy = Math.sin(ang);
  let mx = px | 0, my = py | 0;
  const ddx = Math.abs(1 / dx), ddy = Math.abs(1 / dy);
  let sx, sy, sdx, sdy, side = 0;
  if (dx < 0) { sx = -1; sdx = (px - mx) * ddx; } else { sx = 1; sdx = (mx + 1 - px) * ddx; }
  if (dy < 0) { sy = -1; sdy = (py - my) * ddy; } else { sy = 1; sdy = (my + 1 - py) * ddy; }
  for (let i = 0; i < 64; i++) {
    if (sdx < sdy) { sdx += ddx; mx += sx; side = 0; } else { sdy += ddy; my += sy; side = 1; }
    if (!map[my] || map[my][mx] !== '.') break;
  }
  const d = side ? sdy - ddy : sdx - ddx;
  return [d, side, (side ? px + dx * d : py + dy * d) % 1, map[my]?.[mx]];
}

function loop(t) {
  if (!running) return;
  const dt = Math.min(.05, (t - t0) / 1000); t0 = t;
  if (hp > 0) {
    pa += ((keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0)) * 2.5 * dt;
    const f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0), s = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0), sp = 3.5 * dt;
    const vx = (Math.cos(pa) * f - Math.sin(pa) * s) * sp, vy = (Math.sin(pa) * f + Math.cos(pa) * s) * sp;
    if (ok(px + vx + Math.sign(vx) * .2, py)) px += vx;
    if (ok(px, py + vy + Math.sign(vy) * .2)) py += vy;
  }
  if (t - lastSend > 40) { lastSend = t; send({ t: 'move', x: px, y: py, a: pa }); }
  kick = Math.max(0, kick - dt * 3);
  draw(dt);
  requestAnimationFrame(loop);
}

// ---- Pixel art: characters (front / back / side views) and the first-person shotgun ----
const PAL = { o: '#120a08', k: '#1a1a1a', y: '#ffd23f', g: '#555', m: '#6b6b6b', l: '#9a9a9a', d: '#3a3a3a', w: '#8a5a2b', v: '#5a3a1b', s: '#d9a066', S: '#a8733f', h: '#e6eaf0', z: '#e0b830', Z: '#8f6b12', n: '#4a3426', x: '#b98446' };
const FRONT = [
  '...oooooo...', '..oaaaaaao..', '..oaaaaaao..', '..okkkkkko..', '..okykkyko..', '..obaaaabo..',
  'oaaaaaaaaaao', 'oaaadkkdaaao', 'oaaadmmdaaao', 'oaaaaddaaaao', 'oabbbbbbbbao', '.oaaaaaaaao.',
  '..oooooooo..', '..oaaooaao..', '..oaaooaao..', '..oaaooaao..', '..oaaooaao..', '..okkookko..', '..oooooooo..'];
const BACK = [
  '...oooooo...', '..oaaaaaao..', '..oaaaaaao..', '..obbbbbbo..', '..obbbbbbo..', '..obbbbbbo..',
  'oaaaaaaaaaao', 'oabwwwwwwbao', 'oabvvvvvvbao', 'oaabbbbbbaao', 'oabbbbbbbbao', '.oaaaaaaaao.',
  '..oooooooo..', '..oaaooaao..', '..oaaooaao..', '..oaaooaao..', '..oaaooaao..', '..okkookko..', '..oooooooo..'];
const SIDE = [
  '...oooooo...', '..oaaaaaao..', '..oaaaaaao..', '..oaaakkyo..', '..oaaakkko..', '..oaaaaabo..',
  '..oaaaaaolll', '..oaccaaommm', '..oaabbaaodd', '..oaaaaaao..', '..obbbbbbo..', '...oaaaao...',
  '...oooooo...', '...oaaaao...', '...oaaaao...', '...oaaaao...', '...oaaaao...', '...okkkkko..', '...ooooooo..'];
const GUNL = [
  '......okkkko', '......ohlmdo', '......ohlmdo', '......ohlmdo', '......ohlmdo', '......ohlmdo',
  '......ozzZzo', '......ozzZzo', '......ohlmdo', '......ohlmdo',
  '....oooooooo', '....owwwxwww', '....ovvvvvvv', '....owwwxwww', '....ovvvvvvv', '....owwwxwww', '....oooooooo',
  '..oooooooooo', '..oddmmmllll', '..odmhhhhhhh', '..oddmmmllll', '..oooooooooo',
  '.onnnnnno...', 'onnnnnnnno..', 'onnkkkkknno.', 'onnnnnnnnno.', 'osssssssso..', 'oSSSSSSSSo..'];
function bake(rows, w, flip, pal, shade) {
  const c = document.createElement('canvas'); c.width = w; c.height = rows.length;
  const x = c.getContext('2d');
  rows.forEach((r, y) => {
    r = r.padEnd(w, '.').slice(0, w); if (flip) r = [...r].reverse().join('');
    [...r].forEach((ch, i) => { if (pal[ch]) { x.fillStyle = pal[ch]; x.fillRect(i, y, 1, 1); } });
  });
  if (shade) { x.globalCompositeOperation = 'source-atop'; x.fillStyle = `rgba(0,0,0,${shade * .15})`; x.fillRect(0, 0, w, rows.length); }
  return c;
}
const spriteCache = {};
function sprite(view, hue, flip, lvl) {
  return spriteCache[view + hue + flip + lvl] ||= bake({ front: FRONT, back: BACK, side: SIDE }[view], 12, flip,
    { ...PAL, a: `hsl(${hue},65%,45%)`, b: `hsl(${hue},65%,28%)`, c: `hsl(${hue},70%,62%)` }, lvl);
}
const GUN = bake(GUNL.map(r => r + [...r].reverse().join('')), 24, false, PAL, 0);
const fired = {};

// ---- Scenery: procedural wall textures, dusk sky panorama, flagstone + grass floor ----
let seed = 7; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
function tex(fn) { const c = document.createElement('canvas'); c.width = c.height = 64; fn(c.getContext('2d')); return c; }
function noise(x, col, n, a) { x.fillStyle = col; x.globalAlpha = a; for (let i = 0; i < n; i++) x.fillRect(rnd() * 64 | 0, rnd() * 64 | 0, 2, 1); x.globalAlpha = 1; }
const TEX = {
  '#': tex(x => {
    x.fillStyle = '#3d2620'; x.fillRect(0, 0, 64, 64);
    for (let r = 0; r < 8; r++) for (let c = -1; c < 4; c++) {
      const t = 90 + rnd() * 40 | 0; x.fillStyle = `rgb(${t + 40},${t - 20},${t - 40})`; x.fillRect((r % 2) * 8 + c * 16 + 1, r * 8 + 1, 14, 6);
    }
    noise(x, '#000', 150, .15);
  }),
  S: tex(x => {
    x.fillStyle = '#25252b'; x.fillRect(0, 0, 64, 64);
    for (let r = 0; r < 4; r++) for (let c = -1; c < 3; c++) {
      const t = 110 + rnd() * 40 | 0; x.fillStyle = `rgb(${t},${t},${t + 8})`; x.fillRect((r % 2) * 16 + c * 32 + 1, r * 16 + 1, 30, 14);
    }
    noise(x, '#000', 200, .12); noise(x, '#fff', 80, .08);
  }),
  H: tex(x => {
    x.fillStyle = '#12301a'; x.fillRect(0, 0, 64, 64);
    for (let i = 0; i < 420; i++) { x.fillStyle = `hsl(${100 + rnd() * 40 | 0},${45 + rnd() * 25 | 0}%,${14 + rnd() * 24 | 0}%)`; x.fillRect(rnd() * 64 | 0, rnd() * 64 | 0, 3, 3); }
    for (let i = 0; i < 14; i++) { x.fillStyle = '#e86a8a'; x.fillRect(rnd() * 62 | 0, rnd() * 62 | 0, 2, 2); }
  }),
  P: tex(x => {
    for (let i = 0; i < 64; i++) { const l = 170 + 40 * Math.sin(i / 64 * Math.PI * 8); x.fillStyle = `rgb(${l},${l - 8},${l - 24})`; x.fillRect(i, 0, 1, 64); }
    x.fillStyle = '#8a7a5a'; x.fillRect(0, 0, 64, 6); x.fillRect(0, 58, 64, 6); noise(x, '#000', 100, .08);
  }),
  F: tex(x => {
    x.fillStyle = '#35557f'; x.fillRect(0, 0, 64, 64);
    for (let i = 0; i < 12; i++) { x.fillStyle = `rgba(${150 + rnd() * 80 | 0},220,255,.35)`; x.fillRect(0, i * 5 + rnd() * 3 | 0, 64, 1); }
    x.fillStyle = '#8a8f98'; x.fillRect(0, 0, 64, 8); x.fillRect(0, 56, 64, 8);
  }),
};
TEX.T = tex(x => {
  x.drawImage(TEX['#'], 0, 0); x.fillStyle = '#2a1a10'; x.fillRect(29, 26, 6, 26);
  x.fillStyle = '#ff7b00'; x.beginPath(); x.ellipse(32, 22, 8, 12, 0, 0, 7); x.fill();
  x.fillStyle = '#ffd23f'; x.beginPath(); x.ellipse(32, 24, 4, 7, 0, 0, 7); x.fill();
  x.fillStyle = 'rgba(255,160,40,.25)'; x.fillRect(0, 0, 64, 64);
});
TEX.B = tex(x => {
  x.drawImage(TEX['#'], 0, 0); x.fillStyle = '#8c1017'; x.fillRect(16, 0, 32, 56); x.fillStyle = '#c1121f'; x.fillRect(18, 0, 28, 52);
  x.fillStyle = '#e0b830'; x.fillRect(30, 16, 4, 20); x.fillRect(24, 22, 16, 4);
  x.fillStyle = '#8c1017'; x.beginPath(); x.moveTo(16, 56); x.lineTo(32, 64); x.lineTo(48, 56); x.fill();
});
const SKY = (() => {
  const c = document.createElement('canvas'); c.width = 1400; c.height = 120; const x = c.getContext('2d');
  const gr = x.createLinearGradient(0, 0, 0, 120);
  gr.addColorStop(0, '#0d0a2a'); gr.addColorStop(.55, '#5b2a6e'); gr.addColorStop(.85, '#d9573a'); gr.addColorStop(1, '#ffb347');
  x.fillStyle = gr; x.fillRect(0, 0, 1400, 120);
  for (let i = 0; i < 140; i++) { x.fillStyle = `rgba(255,255,255,${.3 + rnd() * .6})`; x.fillRect(rnd() * 1200 | 0, rnd() * 60 | 0, 1, 1); }
  x.fillStyle = 'rgba(255,240,200,.18)'; x.beginPath(); x.arc(300, 34, 20, 0, 7); x.fill();
  x.fillStyle = '#f4ecd0'; x.beginPath(); x.arc(300, 34, 12, 0, 7); x.fill();
  for (let i = 0; i < 16; i++) { x.fillStyle = 'rgba(255,170,150,.25)'; const cx = rnd() * 1200, cy = 30 + rnd() * 40; for (let j = 0; j < 5; j++) x.fillRect(cx + j * 10, cy + (j % 2) * 2, 26, 3); }
  for (let xx = 0; xx < 1200; xx++) {
    const t = xx / 1200 * Math.PI * 2;
    const h1 = 26 + 14 * Math.sin(t * 3 + 1) + 8 * Math.sin(t * 7 + 2), h2 = 14 + 8 * Math.sin(t * 5) + 5 * Math.sin(t * 11 + 1);
    x.fillStyle = '#4a2a5c'; x.fillRect(xx, 120 - h1, 1, h1);
    x.fillStyle = '#1f1230'; x.fillRect(xx, 120 - h2, 1, h2);
  }
  x.drawImage(c, 0, 0, 200, 120, 1200, 0, 200, 120);
  return c;
})();
const FLOOR = tex(x => {
  x.fillStyle = '#3b3a40'; x.fillRect(0, 0, 64, 64);
  for (let r = 0; r < 4; r++) for (let q = 0; q < 4; q++) { const t = 70 + rnd() * 30 | 0; x.fillStyle = `rgb(${t},${t - 4},${t + 6})`; x.fillRect(q * 16 + 1, r * 16 + 1, 14, 14); }
  for (let i = 0; i < 80; i++) { x.fillStyle = `hsla(${95 + rnd() * 30 | 0},50%,${22 + rnd() * 14 | 0}%,.8)`; x.fillRect(rnd() * 64 | 0, rnd() * 64 | 0, 2 + rnd() * 3 | 0, 2); }
}).getContext('2d').getImageData(0, 0, 64, 64).data;
function floor() {
  const buf = FL.data, hh = H >> 1, dx = Math.cos(pa), dy = Math.sin(pa), qx = -dy * TF, qy = dx * TF;
  for (let y = 0; y < FL.height; y++) {
    const rd = hh / (y + .5), k = Math.max(.1, 1 - rd / 9), j = 1 - k;
    let fx = px + rd * (dx - qx), fy = py + rd * (dy - qy);
    const stx = rd * 2 * qx / W, sty = rd * 2 * qy / W;
    for (let x = 0, o = y * W * 4; x < W; x++, o += 4, fx += stx, fy += sty) {
      const ti = (((fy * 64) & 63) * 64 + ((fx * 64) & 63)) * 4;
      buf[o] = FLOOR[ti] * k + 22 * j; buf[o + 1] = FLOOR[ti + 1] * k + 12 * j; buf[o + 2] = FLOOR[ti + 2] * k + 30 * j; buf[o + 3] = 255;
    }
  }
}
let bob = 0;

// Blend between the two server snapshots surrounding (now - INTERP)
function interp() {
  const rt = performance.now() - INTERP, n = snaps.length;
  if (!n) return pl;
  let a = null, b = null;
  for (let i = n - 1; i > 0; i--) if (snaps[i - 1].t <= rt) { a = snaps[i - 1]; b = snaps[i]; break; }
  if (!a || rt >= b.t) return snaps[n - 1].p;
  const k = (rt - a.t) / (b.t - a.t), out = {};
  for (const i in b.p) {
    const q = b.p[i], o = a.p[i];
    out[i] = o && o.hp > 0 ? { ...q, x: o.x + (q.x - o.x) * k, y: o.y + (q.y - o.y) * k } : q;
  }
  return out;
}

function draw(dt) {
  const vp = interp();
  g.imageSmoothingEnabled = false;
  const sx = (((pa - FOV / 2) / (Math.PI * 2)) % 1 + 1) % 1 * 1200;
  g.drawImage(SKY, sx | 0, 0, 200, 120, 0, 0, W, H >> 1);
  floor(); g.putImageData(FL, 0, H >> 1);
  for (let x = 0; x < W; x++) {
    const ra = pa + Math.atan((x / W - .5) * 2 * TF);
    const [d, side, u, ch] = cast(ra);
    const pd = Math.max(.05, d * Math.cos(ra - pa)); zb[x] = pd;
    const lh = H / pd, top = (H - lh) / 2, sh = Math.max(.12, 1 - pd / 11) * (side ? .75 : 1);
    g.drawImage(TEX[ch] || TEX['#'], Math.min(63, u * 64 | 0), 0, 1, 64, x, top, 1, lh);
    g.fillStyle = `rgba(22,12,30,${(1 - sh) * (ch === 'T' ? .45 : 1)})`; g.fillRect(x, top, 1, lh);
  }
  g.imageSmoothingEnabled = false;
  Object.values(vp).filter(p => p.id !== id && p.hp > 0)
    .map(p => ({ p, d: Math.hypot(p.x - px, p.y - py) })).sort((a, b) => b.d - a.d)
    .forEach(({ p, d }) => {
      const brg = Math.atan2(p.y - py, p.x - px);
      let df = brg - pa; df = Math.atan2(Math.sin(df), Math.cos(df));
      if (Math.abs(df) > FOV) return;
      const pd = d * Math.cos(df); if (pd < .2) return;
      let rel = p.a - brg; rel = Math.atan2(Math.sin(rel), Math.cos(rel));
      const view = Math.abs(rel) < .6 ? 'back' : Math.abs(rel) > 2.5 ? 'front' : 'side';
      const img = sprite(view, p.id * 67 % 360, view === 'side' && rel < 0, Math.min(4, pd / 2.5 | 0));
      const sz = H / pd, cx = (.5 + Math.tan(df) / (2 * TF)) * W;
      const ph = sz * .8, pw = ph * 12 / 19, bottom = (H + sz) / 2, top = bottom - ph, x0 = cx - pw / 2;
      for (let x = Math.max(0, x0 | 0); x < Math.min(W, x0 + pw); x++) {
        if (zb[x] < pd) continue;
        g.drawImage(img, Math.min(11, (x - x0) / pw * 12 | 0), 0, 1, 19, x, top, 1, ph);
      }
      if (performance.now() - (fired[p.id] || 0) < 110) {
        const fl = view === 'side' ? [x0 + (rel < 0 ? 0 : pw), top + ph * .4] : view === 'front' ? [cx, top + ph * .4] : null;
        if (fl && zb[Math.min(W - 1, Math.max(0, fl[0] | 0))] >= pd) {
          const r = Math.max(2, ph * .22);
          g.fillStyle = '#ff7b00'; g.fillRect(fl[0] - r, fl[1] - r, r * 2, r * 2);
          g.fillStyle = '#ffd23f'; g.fillRect(fl[0] - r * .6, fl[1] - r * .6, r * 1.2, r * 1.2);
          g.fillStyle = '#fff'; g.fillRect(fl[0] - r * .25, fl[1] - r * .25, r * .5, r * .5);
        }
      }
      if (zb[Math.min(W - 1, Math.max(0, cx | 0))] >= pd) {
        g.fillStyle = '#000'; g.fillRect(cx - 10, top - 8, 20, 4);
        g.fillStyle = '#e5383b'; g.fillRect(cx - 9, top - 7, 18 * p.hp / 100, 2);
        g.fillStyle = '#fff'; g.font = '8px monospace'; g.textAlign = 'center'; g.fillText(p.name, cx, top - 11);
      }
    });

  // first-person shotgun: pixel art, walk bob, recoil and muzzle flash
  const moving = hp > 0 && (keys.KeyW || keys.KeyA || keys.KeyS || keys.KeyD);
  bob = moving ? bob + dt * 9 : bob * .9;
  const gx = (W / 2 - 36 + Math.sin(bob) * 4) | 0, gy = (H - 74 + Math.abs(Math.cos(bob)) * 4 + kick * 12) | 0;
  g.drawImage(GUN, gx, gy, 72, 84);
  if (kick > .65) {
    const fx = gx + 36, fy = gy;
    g.fillStyle = 'rgba(255,180,60,.16)'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#ff7b00'; g.fillRect(fx - 18, fy - 12, 36, 16);
    g.fillStyle = '#ffd23f'; g.fillRect(fx - 12, fy - 20, 24, 26);
    g.fillStyle = '#fff'; g.fillRect(fx - 5, fy - 14, 10, 14);
  }
  g.fillStyle = kick > .5 ? '#ff4d4d' : '#fff';
  [[-6, -1, 4, 2], [2, -1, 4, 2], [-1, -6, 2, 4], [-1, 2, 2, 4]].forEach(([a, b, c, d]) => g.fillRect(W / 2 + a, H / 2 + b, c, d));

  if (flash > 0) { g.fillStyle = `rgba(200,0,0,${flash * .5})`; g.fillRect(0, 0, W, H); flash -= dt * 2; }
  if (hp <= 0) {
    g.fillStyle = 'rgba(80,0,0,.6)'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#fff'; g.font = 'bold 20px monospace'; g.textAlign = 'center';
    g.fillText('YOU DIED', W / 2, H / 2); g.font = '10px monospace'; g.fillText('respawning…', W / 2, H / 2 + 16);
  }

  // HUD
  g.textAlign = 'left'; g.font = 'bold 16px monospace';
  const PH = 22, py0 = H - PH, hpv = Math.max(0, hp);
  g.fillStyle = '#1d100d'; g.fillRect(0, py0, W, PH); g.fillStyle = '#c1121f'; g.fillRect(0, py0, W, 2);
  g.font = 'bold 14px monospace'; g.fillStyle = hp > 30 ? '#e8d9c0' : '#ff4d4d'; g.fillText(hpv + '', 8, py0 + 17);
  g.fillStyle = '#000'; g.fillRect(44, py0 + 8, 82, 8);
  g.fillStyle = hp > 30 ? '#3fb950' : '#e5383b'; g.fillRect(45, py0 + 9, 80 * hpv / 100, 6);
  const fx = W / 2 - 8, fy = py0 + 4;
  g.fillStyle = '#d9a066'; g.fillRect(fx, fy, 16, 16);
  g.fillStyle = '#3a2412'; g.fillRect(fx, fy, 16, 4);
  g.fillStyle = hp > 0 ? '#111' : '#900'; g.fillRect(fx + 3, fy + 6, 3, 3); g.fillRect(fx + 10, fy + 6, 3, 3);
  g.fillStyle = '#7a2d1a';
  if (hp > 66) g.fillRect(fx + 4, fy + 12, 8, 1); else if (hp > 33) g.fillRect(fx + 5, fy + 12, 6, 2); else g.fillRect(fx + 4, fy + 11, 8, 3);
  g.fillStyle = '#b01515';
  if (hp < 66) g.fillRect(fx + 2, fy + 3, 2, 5);
  if (hp < 33) g.fillRect(fx + 11, fy + 9, 3, 6);
  g.font = '8px monospace'; g.fillStyle = '#e8d9c0'; g.fillText('SHOTGUN', W - 118, py0 + 9);
  g.fillStyle = '#000'; g.fillRect(W - 118, py0 + 12, 62, 6);
  g.fillStyle = kick > .5 ? '#e5383b' : '#ffd23f'; g.fillRect(W - 117, py0 + 13, 60 * (1 - kick), 4);
  const now = performance.now(); feed = feed.filter(f => now - f[1] < 5000);
  g.font = '9px monospace'; g.fillStyle = '#fff';
  feed.forEach((f, i) => g.fillText(f[0], 6, 12 + i * 11));
  const S = 3, ox = W - map.length * S - 4;
  map.forEach((row, y) => [...row].forEach((c, x) => {
    if (c !== '.') { g.fillStyle = 'rgba(200,200,200,.45)'; g.fillRect(ox + x * S, 4 + y * S, S, S); }
  }));
  Object.values(vp).forEach(p => {
    if (p.hp <= 0) return;
    const mine = p.id === id; g.fillStyle = mine ? '#0f0' : '#f33';
    g.fillRect(ox + (mine ? px : p.x) * S - 1, 4 + (mine ? py : p.y) * S - 1, 3, 3);
  });
  g.textAlign = 'right'; g.fillStyle = '#e8d9c0'; g.fillText((rtt | 0) + ' ms', W - 4, py0 + 16);
  Object.values(pl).sort((a, b) => b.sc - a.sc).slice(0, 5)
    .forEach((p, i) => g.fillText(`${p.name} ${p.sc}/${p.d}`, W - 4, map.length * S + 18 + i * 10));
}
</script>
